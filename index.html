<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardion Staking DApp</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🔥 Ardion Staking Portal</h1>
    <p>Stake your ARDION tokens and earn rewards directly on Solana!</p>

    <div class="card">
      <button id="connectWallet">Connect Wallet</button>

      <div id="walletInfo" class="hidden">
        <p>Connected wallet: <span id="walletAddress"></span></p>
        <input type="number" id="stakeAmount" placeholder="Enter amount to stake">
        <button id="stakeButton">Stake Now</button>
      </div>

      <div id="status"></div>
    </div>

    <div class="card">
      <h2>Leaderboard</h2>
      <button id="showLeaderboard">Show Leaderboard</button>
      <table id="leaderboard">
        <thead>
          <tr>
            <th>#</th>
            <th>Wallet</th>
            <th>Staked</th>
            <th>Reward</th>
          </tr>
        </thead>
        <tbody>
          <!-- Leaderboard rows injected here by app.js -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
